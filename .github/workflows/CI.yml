name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Single source of truth for the toolchain. bump Go here and in go.mod together.
env:
  GO_VERSION: "1.26.5"

jobs:
  # Fast gate: the exact checks the README mandates. No database required —
  # store integration tests self-skip without RUN_DB_TESTS.
  unit:
    name: Build / vet / fmt / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Test
        run: go test ./... -race -count=1

  # Real-Postgres path: runs migrations + the env-gated integration test, then
  # boots the server and drives the actual vili CLI through a full chat loop,
  # asserting the membership gate returns 404 to a non-member for both read
  # and post.
  integration:
    name: Integration (Postgres) + CLI smoke
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/vili?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/vili?sslmode=disable
      JWT_SECRET: ci-secret-not-real-do-not-use-in-prod
      PORT: "8080"
      RUN_DB_TESTS: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vili
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Store integration test (open / ping / migrate twice)
        run: go test ./internal/store/... -run TestOpenPingMigrate -count=1 -v

      - name: Build server and CLI
        run: |
          go build -o bin/vili-server ./cmd/server
          go build -o bin/vili ./cmd/vili

      - name: Start server
        run: |
          ./bin/vili-server > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ready > /dev/null; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready" >&2
          cat server.log >&2
          exit 1

      - name: CLI smoke — register, login, create, send, read back
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/cfg-a
        run: |
          set -e
          ./bin/vili --server http://localhost:8080 register alice supersecret
          ./bin/vili --server http://localhost:8080 login alice supersecret
          CREATE_OUT=$(./bin/vili --server http://localhost:8080 create lobby "smoke room")
          echo "$CREATE_OUT"
          ROOM_ID=$(echo "$CREATE_OUT" | sed -n 's/.*id \([^)]*\).*/\1/p')
          test -n "$ROOM_ID" || { echo "no room id parsed" >&2; exit 1; }
          ./bin/vili --server http://localhost:8080 send "$ROOM_ID" hello world
          HISTORY=$(./bin/vili --server http://localhost:8080 history "$ROOM_ID")
          echo "$HISTORY"
          echo "$HISTORY" | grep -q "hello world" || { echo "message missing from history" >&2; exit 1; }
          echo "ROOM_ID=$ROOM_ID" >> "$GITHUB_ENV"

      - name: Membership gate — non-member gets 404 on history and post
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/cfg-b
        run: |
          set -e
          ./bin/vili --server http://localhost:8080 register bob anothersecret
          ./bin/vili --server http://localhost:8080 login bob anothersecret
          for op in history send; do
            if ./bin/vili --server http://localhost:8080 $op "$ROOM_ID" probe 2>&1 | grep -qi "not found"; then
              echo "non-member $op correctly denied (404)"
            else
              echo "FAIL: non-member $op was not denied" >&2
              exit 1
            fi
          done

      - name: Server log
        if: always()
        run: cat server.log

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
